[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  # bincode is unmaintained in every version, 2.x included, and there is no patched release.
  # It defines our on-disk format. The advisory is informational, not a vulnerability.
  "RUSTSEC-2025-0141",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # webpki-roots ships Mozilla's CA bundle; CDLA is a data licence, right for certificate data.
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
