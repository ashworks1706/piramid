[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  # bincode is unmaintained with no patched release; the advisory is informational.
  "RUSTSEC-2025-0141",
  # paste is unmaintained with no patched release; candle pulls it in through gemm.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # webpki-roots ships Mozilla's CA bundle under CDLA.
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
  "LicenseRef-Piramid",
]
exceptions = []

# The workspace crates carry the proprietary LICENSE file, which has no SPDX identifier.
[[licenses.clarify]]
crate = "piramid"
expression = "LicenseRef-Piramid"
license-files = [{ path = "../../LICENSE", hash = 0x4a6e3276 }]

[[licenses.clarify]]
crate = "piramid-core"
expression = "LicenseRef-Piramid"
license-files = [{ path = "../../../LICENSE", hash = 0x4a6e3276 }]

[[licenses.clarify]]
crate = "piramid-hardware"
expression = "LicenseRef-Piramid"
license-files = [{ path = "../../../LICENSE", hash = 0x4a6e3276 }]

[[licenses.clarify]]
crate = "piramid-database"
expression = "LicenseRef-Piramid"
license-files = [{ path = "../../../LICENSE", hash = 0x4a6e3276 }]

[[licenses.clarify]]
crate = "piramid-model"
expression = "LicenseRef-Piramid"
license-files = [{ path = "../../../LICENSE", hash = 0x4a6e3276 }]

[[licenses.clarify]]
crate = "piramid-serving"
expression = "LicenseRef-Piramid"
license-files = [{ path = "../../../LICENSE", hash = 0x4a6e3276 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
