name: Bug
description: Piramid did something wrong, was slow, or failed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what happened, what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The crate version, or the commit for a source build.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: linux x86_64, CPU-only; or macOS arm64, CUDA 12
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with anything private removed.
      render: text
