name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Gate a branch on demand. A pull request into anything but main runs no other trigger, so a
  # stacked branch has no gate without this.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # candle-kernels asks nvidia-smi for the compute capability unless this is set, and runners have no GPU.
  CUDA_COMPUTE_CAP: "80"

jobs:
  # Path filters decide which jobs run.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      website: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.website == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'apps/engine/**'
              - 'apps/cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            website:
              - 'apps/website/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just check-rust

  # cargo check per feature combination. The CUDA rows install nvcc, which the build uses to pick
  # the toolkit version.
  features:
    name: Features (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gpu-cuda
            flags: --features gpu-cuda
            cuda: true
          - name: inference-candle
            flags: --features inference-candle
          - name: otel
            flags: --features otel
          - name: all
            flags: --all-features
            cuda: true
          - name: no-default
            flags: --no-default-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcurand-dev"]'
      - run: cargo check --workspace --all-targets ${{ matrix.flags }}

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcurand-dev"]'
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Fails on a missing include or an unversioned path dependency.
  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --no-verify --allow-dirty

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: cd apps/website && npm ci
      - run: cd apps/website && npm run lint
