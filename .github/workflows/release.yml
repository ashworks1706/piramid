name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build binaries for, e.g. v0.2.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Builds a tag's binaries and GitHub release. install.sh downloads the binaries
# from the latest release.

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary (${{ matrix.asset }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: piramid-linux-amd64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: piramid-linux-arm64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: piramid-macos-amd64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: piramid-macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: piramid-windows-amd64
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin piramid --features inference-candle

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" piramid

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a "$env:GITHUB_WORKSPACE\${{ matrix.asset }}.zip" piramid.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset }}.${{ matrix.archive }}

  release:
    name: GitHub release
    needs: [resolve, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: piramid-*
          merge-multiple: true

      - name: Resolve release notes
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          for candidate in "release-notes/${tag}.md" "release-notes/${tag#v}.md"; do
            if [ -f "$candidate" ]; then cp "$candidate" body.md; exit 0; fi
          done
          printf 'Piramid %s\n' "$tag" > body.md

      - run: cp config.example.yaml assets/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Piramid ${{ needs.resolve.outputs.tag }}
          body_path: body.md
          generate_release_notes: true
          files: assets/*
