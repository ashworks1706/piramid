name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build binaries for, e.g. v0.2.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

# Builds a tag's binaries, images, SBOMs and GitHub release. release-plz publishes to crates.io.

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary (${{ matrix.asset }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: piramid-linux-amd64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: piramid-linux-arm64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: piramid-macos-amd64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: piramid-macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: piramid-windows-amd64
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin piramid

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" piramid

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a "$env:GITHUB_WORKSPACE\${{ matrix.asset }}.zip" piramid.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset }}.${{ matrix.archive }}

  images:
    name: Image (${{ matrix.name }})
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            dockerfile: deploy/docker/piramid.Dockerfile
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - name: cuda
            dockerfile: deploy/docker/piramid-cuda.Dockerfile
            suffix: "-cuda"
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Piramid
            org.opencontainers.image.description=Inference engine for retrieval systems.
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

  release:
    name: GitHub release
    needs: [resolve, binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: piramid-*
          merge-multiple: true

      - name: Resolve release notes
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          for candidate in "release-notes/${tag}.md" "release-notes/${tag#v}.md"; do
            if [ -f "$candidate" ]; then cp "$candidate" body.md; exit 0; fi
          done
          printf 'Piramid %s\n' "$tag" > body.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Piramid ${{ needs.resolve.outputs.tag }}
          body_path: body.md
          generate_release_notes: true
          files: assets/*
