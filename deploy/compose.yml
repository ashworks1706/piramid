# Development stack, built from source. Run with just up, just down and just logs.
# compose.prod.yml layers prebuilt GHCR images on top (just prod-up).

services:
  piramid:
    build:
      context: ..
      dockerfile: deploy/docker/piramid.Dockerfile
    ports:
      - "6333:6333"
    volumes:
      - piramid-data:/data
    # PIRAMID_API_KEY must be set in ../.env; the server binds every interface and refuses to
    # start without a key. PIRAMID__STARTUP__LOGGING__LEVEL in ../.env sets the log level.
    env_file:
      - path: ../.env
        required: false
    environment:
      PIRAMID__STARTUP__BIND: 0.0.0.0:6333
      PIRAMID__STARTUP__DATA_DIR: /data
    restart: unless-stopped
    # Longer than startup.http.drain_timeout_secs.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Local embeddings for the /embed endpoints. Start with: just up ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  piramid-data:
  ollama-data:
