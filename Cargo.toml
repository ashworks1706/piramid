[workspace]
resolver = "2"
members = [
    "apps/engine/core",
    "apps/engine/hardware",
    "apps/engine/database",
    "apps/engine/model",
    "apps/engine/serving",
    "apps/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ashworks1706/piramid"
homepage = "https://piramiddb.com"
documentation = "https://docs.rs/piramid"
rust-version = "1.87"  # `usize::is_multiple_of` / `next_multiple_of`, used by compute::kernels

[workspace.dependencies]
# in-repo crates, so versions stay in lockstep
piramid-core = { path = "apps/engine/core", version = "0.2.0" }
piramid-hardware = { path = "apps/engine/hardware", version = "0.2.0" }
piramid-database = { path = "apps/engine/database", version = "0.2.0" }
piramid-model = { path = "apps/engine/model", version = "0.2.0" }
piramid-serving = { path = "apps/engine/serving", version = "0.2.0" }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "3.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# errors
thiserror = "2.0"

# async + http
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "limit", "set-header", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
# 0.32.1 fixes GHSA-w9wp-h8wv-79jx (unbounded allocation in Baggage propagation)
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }

# cli
clap = { version = "4.5", features = ["derive"] }

# compute
wide = "1.6"
rayon = "1.10"
num_cpus = "1.16"
rand = "0.9.4"

# storage + concurrency
memmap2 = "0.9.11"
lru = "0.18.2"
dashmap = "6.0"
parking_lot = "0.12"
libc = "0.2"

# dev
criterion = { version = "0.8", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
# compute, gpu and inference deny this themselves. ~860 undocumented items elsewhere.
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Tests opt back in with #[allow] at the module level.
unwrap_used = "deny"
expect_used = "deny"
# Modern idioms, so the codebase does not drift back to older forms.
uninlined_format_args = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
match_same_arms = "deny"
cast_lossless = "deny"
needless_raw_string_hashes = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
debug = true
