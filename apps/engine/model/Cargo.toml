[package]
name = "piramid-model"
description = "Model execution and the embedding providers that feed it."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
piramid-core.workspace = true
piramid-hardware.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest.workspace = true
lru.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
rand.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[features]
default = []
inference-candle = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers"]
gpu-cuda = ["piramid-hardware/gpu-cuda", "candle-core?/cuda"]

[lints]
workspace = true
