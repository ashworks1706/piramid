[package]
name = "piramid-core"
description = "Shared foundation for Piramid: errors, configuration, metadata, validation, and self-measurement."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
piramid-hardware.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Optional exporters. Default builds pull in none of these.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
num_cpus.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
yaml_serde.workspace = true

[features]
default = []

# Export traces over OTLP. Any OTLP collector works — Axiom, Grafana Tempo, Honeycomb,
# Jaeger — so this is one feature rather than one per vendor.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[lints]
workspace = true
