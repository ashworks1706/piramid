[project]
name = "piramid"
version = "0.2.0"
description = "Python client for Piramid, an inference engine for retrieval systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "typing-extensions>=4.7"]
keywords = ["rag", "llm", "retrieval", "inference", "piramid"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://piramiddb.com"
Documentation = "https://piramiddb.com/docs"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piramid"]
