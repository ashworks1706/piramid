[package]
name = "piramid"
description = "Inference engine for retrieval systems: one binary for vector storage, search, and retrieval-fused inference."
readme = "../../README.md"
keywords = ["vector-database", "rag", "embeddings", "search", "inference"]
categories = ["database-implementations", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
default-run = "piramid"

[lib]
name = "piramid"
path = "src/lib.rs"

[[bin]]
name = "piramid"
path = "src/main.rs"

[features]
default = []
gpu-cuda = ["piramid-hardware/gpu-cuda", "piramid-model/gpu-cuda", "piramid-serving/gpu-cuda"]
inference-candle = ["piramid-model/inference-candle", "piramid-serving/inference-candle"]
# Export traces over OTLP to any collector (Axiom, Tempo, Honeycomb, Jaeger).
otel = ["piramid-core/otel"]

[dependencies]
rayon.workspace = true
piramid-core.workspace = true
piramid-hardware.workspace = true
piramid-database.workspace = true
piramid-model.workspace = true
piramid-serving.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
reqwest.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures.workspace = true
chrono.workspace = true

# The workspace lints, restated in full, with println and eprintln allowed.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
unwrap_used = "allow"
expect_used = "allow"
