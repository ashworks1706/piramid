# Piramid configuration.
#
# Every value below is the default, so an empty file and this file behave identically. Point the
# server at one with CONFIG_FILE=config.yaml, and check what actually resolved with
# `piramid show config`.
#
# There are two blocks, split by when a setting takes effect:
#
#   startup:  applied once at boot. Changing one needs a restart, and POST /config/reload
#             refuses a file whose startup block differs from the running one.
#   runtime:  re-read on POST /config/reload. Takes effect for collections opened after the
#             reload, and for each request that reads the value on its way through.
#
# Any key can also be set from the environment, spelled from its path:
# `runtime.cache.max_bytes` is PIRAMID__RUNTIME__CACHE__MAX_BYTES. Values parse as YAML, so
# `8`, `true` and `null` mean what they do here. Environment wins over the file.
#
# An unknown or misspelled key is a startup error, never a silent default. So is a setting that
# is not implemented yet — the ones marked "not implemented" below exist so the shape is settled,
# and turning one on fails loudly rather than being ignored.

startup:
  # address:port to listen on. A non-loopback address, such as 0.0.0.0:6333, needs an API key
  # or startup.http.auth.allow_unauthenticated, or the server refuses to start.
  bind: 127.0.0.1:6333

  # root directory for collection data; each collection gets a subdirectory
  data_dir: ./data

  # worker threads for parallel search and indexing; null is one per core
  threads: null

  logging:
    enabled: true
    # error | warn | info | debug | trace. RUST_LOG overrides this entirely.
    level: info
    # per-subsystem switches, each one a tracing target
    config: true
    indexing: true
    search: true
    writes: true
    inference: true
    http: true
    # structured JSON lines instead of human-readable console output
    json: false
    # queries slower than this are logged at warn
    slow_query_ms: 500

  telemetry:
    # OTLP trace export; null disables it. Requires a build with the `otel` feature.
    otlp: null
    #   endpoint: http://localhost:4317
    #   service_name: piramid
    # log a line as each instrumented operation finishes, with its duration and fields
    span_events: false

  hardware:
    # auto | cpu-only | gpu. This is the only GPU switch; `gpu` fails to start without a device.
    profile: auto
    # host memory the process will use; null is unbounded
    memory_budget_bytes: null
    # device memory to claim; null is unbounded
    gpu_memory_budget_bytes: null

    gpu:
      # Which device to open when the host has more than one.
      device_ordinal: 0
      # Threads per block for distance kernels. Must be a multiple of 32.
      distance_block_size: 256
      # Retrieval and the forward pass each want one, so they overlap rather than serialise.
      streams: 2
      # Held back for fragmentation and library workspaces.
      reserve_bytes: 1073741824
    vram:
      # Divide device memory between weights, KV and the index instead of first-come-first-served.
      # Not implemented (roadmap v0.6.0).
      enabled: false
      weights_ratio: 0.6
      kv_ratio: 0.15
      index_ratio: 0.25
      # Bandwidth retrieval may take while a pass is decoding. Decode reads every weight per
      # token, so a search kernel streaming the slab contends with it.
      retrieval_bandwidth_share: 0.25

  disk:
    # refuse writes below this much free space; null never checks
    min_free_bytes: null
    # drop to read-only at the threshold instead of failing each write
    readonly_on_low_space: true

  http:
    # With PIRAMID_API_KEY set, every route except /api/health and /api/readyz requires
    # Authorization: Bearer <key>. The key is read from the environment only, never from this file.
    auth:
      # serve a non-loopback bind with no key; setting this while PIRAMID_API_KEY is set is an error
      allow_unauthenticated: false
    # Per-client token bucket, keyed by peer address; a request over it gets 429 with
    # Retry-After. null disables it. Behind a reverse proxy every client shares one bucket.
    rate_limit:
      requests_per_second: 100
      burst: 200
    # seconds in-flight requests get to finish after SIGINT or SIGTERM, before every open
    # collection is checkpointed and the process exits
    drain_timeout_secs: 30

  # embedding provider, built once at boot; null disables server-side embedding.
  # Set the key with OPENAI_API_KEY rather than writing it here.
  embedding: null
  #   provider: openai        # openai (or any server speaking that format) | ollama
  #   model: text-embedding-3-small
  #   base_url: null          # for self-hosted or proxied endpoints
  #   timeout: null           # request timeout in seconds
  #   options: {}             # passed through to the provider verbatim
  #
  # provider: piramid — an in-process encoder reusing the device retrieval holds.
  # Not implemented (roadmap v0.4.0).

runtime:
  index:
    # auto | flat | hnsw | ivf. `auto` picks a family from the collection's size; the others
    # take that family's parameters inline (see the commented examples below).
    type: auto
    # cosine | euclidean | dotproduct
    metric: cosine
    auto:
      # under this many vectors, scan exhaustively
      flat_max_vectors: 10000
      # under this many, use IVF; above it, HNSW
      ivf_max_vectors: 100000
      # IVF: null sizes clusters and probes from the collection
      ivf_num_clusters: null
      ivf_num_probes: null
      ivf_max_iterations: 10
      # HNSW shape used when auto-selected
      hnsw_m: 16
      hnsw_ef_construction: 200
      hnsw_ef_search: 200
  #
  # type: hnsw
  # metric: cosine
  # m: 16                 # max connections per node above layer 0
  # m_max: 32             # max connections at layer 0, conventionally 2 * m
  # ef_construction: 200  # candidate width while linking a new node
  # ef_search: 200        # candidate width while searching: the recall/speed dial
  # ml: 0.36067376        # layer multiplier, conventionally 1 / ln(m)
  #
  # type: ivf
  # metric: cosine
  # num_clusters: 256     # partitions; sqrt(N) is a reasonable starting point
  # num_probes: 8         # partitions scanned per query; higher is better recall and slower
  # max_iterations: 10    # Lloyd's-algorithm cap when training centroids
  #
  # type: flat
  # metric: cosine

  search:
    # per-query overrides; null uses the index's own ef_search / num_probes
    ef: null
    nprobe: null
    # multiplier on k when a filter is present, since candidates get filtered out
    filter_overfetch: 10
    # fan a batch of queries across the worker threads
    parallel: true

  quantization:
    # none | int8 | binary. int4 and float16 are not implemented.
    level: none
    # keep only the compressed form in memory
    disk_only: false
    # disabled | storage | index | query-pre-search | result-post-search
    stage: disabled
    # keep full-precision vectors alongside the codes, for reranking
    preserve_raw_vectors: true

  memory:
    # byte ceiling per collection; null is unbounded
    max_memory_per_collection: null
    # size the data file is first mapped at; it grows from here
    initial_mmap_size: 1048576
    # map the data file; with this off, records go through ordinary file reads
    use_mmap: true

  wal:
    enabled: true
    # checkpoint after this many operations
    checkpoint_frequency: 1000
    # also checkpoint after this many seconds, if set
    checkpoint_interval_secs: null
    # rotate once the log passes this many bytes
    max_log_size: 104857600
    # fsync every write: durable across power loss, and much slower
    sync_on_write: false

  limits:
    # per-collection ceilings; null is unlimited
    max_vectors: null
    max_bytes: null
    max_vector_bytes: null

  # Three caches with different jobs, configured separately because the cost of a miss differs:
  # a dropped metadata entry is a disk read, a dropped resident vector is a document search cannot
  # score, and a dropped embedding is a paid API call.
  cache:
    vectors:
      # Vectors held resident for search. Not really a cache — an evicted vector is missing from
      # results, not just slower. Bounds are not enforced yet, so setting one is an error.
      entries: null
      max_bytes_per_collection: null
      # none | oldest | lru. Not implemented for this store.
      eviction: none
    metadata:
      enabled: true
      entries: 10000
      # Entry lifetime in seconds. Not implemented yet.
      ttl_seconds: null
      # none | oldest | lru. Only `oldest` is implemented.
      eviction: oldest
    embeddings:
      # Identical text is not sent to a provider twice. Size this above your corpus, or the tail
      # is re-embedded on every pass.
      enabled: true
      entries: 10000
    # Byte budget for resident vectors, shared across every loaded collection.
    max_bytes: null

  # auto | scalar | simd | parallel | binary | gpu. The one place a distance strategy is chosen.
  # `gpu` needs a build with the `gpu-cuda` feature.
  execution: auto

  # Model execution. Not implemented (roadmap v0.4.0); setting `enabled: true` or
  # `augment.enabled: true` fails at startup rather than being ignored.
  # Model execution. None of this is implemented — the shape is settled so the forward-pass work
  # lands into a surface that already exists, and every switch below fails at startup rather than
  # parsing and doing nothing.
  inference:
    # Not implemented (roadmap v0.4.0).
    enabled: false
    model_path: null
    # Only needed when the tokenizer does not sit beside the weights.
    tokenizer_path: null
    # Which forked model file drives the pass. null reads it from the checkpoint.
    architecture: null
    # cuda:0, or null to follow startup.hardware.
    device: null
    # auto | fp32 | fp16 | bf16. Weight precision at load.
    dtype: auto
    max_sequence_length: 4096
    # A throwaway pass at boot, so the first real request does not pay for allocation.
    warmup: true

    batching:
      # Sequences in one forward pass.
      max_batch_size: 8
      # Sequences admitted and waiting, across all passes.
      max_queue_depth: 256
      # Token ceiling per step, so one long prefill cannot crowd out every decode.
      max_batched_tokens: 8192
      # Keep admitting into a running batch instead of draining it first.
      continuous: false
      # Split a long prefill across steps so decode is not starved.
      chunked_prefill: false
      prefill_chunk_tokens: 2048
      # How long a request may wait for a slot. null waits forever.
      queue_timeout_ms: 30000

    kv_cache:
      # Budget across every live sequence; null is unbounded.
      max_bytes: null
      # Tokens per page: the unit of allocation and eviction.
      page_size: 16
      # The largest single lever on cache size. A 7B model's 8k cache is ~2 GB at fp16.
      dtype: fp16
      # Fraction of what device memory remains after weights.
      device_fraction: 0.9
      # Share pages between sequences with an identical prefix, such as a common system prompt.
      prefix_sharing: true
      # recompute | swap. What a preempted sequence does with its pages.
      preemption: recompute

    sampling:
      temperature: 0.0  # 0.0 is greedy
      top_p: null
      top_k: null
      # 1.0 is no penalty.
      repetition_penalty: 1.0
      repetition_window: 64
      # Default completion length when a request does not say.
      max_new_tokens: 512
      stop: []
      # Fixed seed, so a benchmark's control arm is reproducible.
      seed: null

    # Where retrieval enters the forward pass. Not implemented (roadmap v0.6.0).
    fusion:
      enabled: false
      # Which hook implementation to install, by registered name.
      hook: null
      # Which collection it queries. null uses the request's.
      collection: null
      # sequence-start | chunk-boundary | layer-entry.
      point: sequence-start
      top_k: 8
      # Candidates fetched before filtering, as a multiple of top_k.
      overfetch: 1
      score_threshold: null
      # Tokens between calls at chunk-boundary. ~16 calls in a 512-token generation.
      chunk_tokens: 32
      # Fire every Nth decoder layer at layer-entry.
      layer_stride: 1
      max_calls_per_sequence: null
      # Abandon a retrieval that misses this budget rather than stalling the pass.
      deadline_us: 100
      # skip | stall | error.
      on_deadline_miss: skip
      # Run retrieval on its own device stream so it overlaps the pass beside it.
      own_stream: true
      dedupe_across_calls: true
      # Tokens the prompt-stuffed control arm may spend, so a comparison is at equal budget.
      token_budget: null
      # Store token ids for retrieved documents, so the hot path skips tokenization.
      pretokenize_documents: true
      # Trained adapter weights, for architectures that have not been forked.
      adapter_path: null

    # Precomputed KV for retrieved documents, reused at prefill. Not context-independent —
    # position and preceding context change it — so a fraction is recomputed on reuse.
    # Not implemented (roadmap v0.6.0).
    document_kv:
      enabled: false
      max_bytes: null
      # device | host | disk.
      storage: host
      recompute_ratio: 0.15

# The terminal UI. Read when `piramid` starts with no subcommand.
console:
  # Server to watch. Empty follows startup.bind, so moving the port is said once.
  base_url: ""
  # Website to probe. Shown only inside a checkout.
  web_url: http://localhost:3000
  # Lines kept in memory per unit. Full output goes to log_dir regardless.
  log_lines: 5000
  log_dir: target/console-logs
  # Seconds between health probes and collection refreshes.
  refresh_secs: 5
