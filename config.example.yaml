# Piramid configuration.
#
# Every value below is the default, so an empty file and this file behave identically. Point the
# server at one with piramid serve --config config.yaml or CONFIG_FILE=config.yaml, and read what
# resolved from GET /api/config.
#
# A minimal file for serving RAG sets startup.embedding, runtime.inference.enabled and
# runtime.inference.model_path, plus startup.hardware.profile: gpu and runtime.execution: gpu on a
# GPU, or runtime.inference.kv_cache.max_bytes on the cpu.
#
# There are three blocks, split by when a setting takes effect:
#
#   startup:  applied once at boot. Changing one needs a restart, and POST /api/config/reload
#             refuses a file whose startup block differs from the running one.
#   runtime:  re-read on POST /api/config/reload. Batch search parallelism, limits, WAL
#             checkpoint thresholds and execution reach open collections; a change to anything
#             read when a collection opens is refused while one is open. search.metric applies
#             to collections created afterwards.
#   console:  read when piramid starts with no subcommand and opens the terminal UI.
#
# Any key can also be set from the environment, spelled from its path:
# runtime.wal.max_log_size is PIRAMID__RUNTIME__WAL__MAX_LOG_SIZE. Values parse as YAML, so
# 8, true and null mean what they do here. Environment wins over the file.
#
# An unknown or misspelled key is a startup error. So is changing a setting marked not
# implemented below from its default.

startup:
  # address:port to listen on. A non-loopback address, such as 0.0.0.0:6333, needs an API key
  # or startup.http.auth.allow_unauthenticated, or the server refuses to start.
  bind: 127.0.0.1:6333

  # root directory for collection data; each collection gets a subdirectory
  data_dir: ./data

  # worker threads for parallel search; null is one per core
  threads: null

  logging:
    enabled: true
    # error | warn | info | debug | trace
    level: info
    # per-subsystem switches, each one a tracing target
    config: true
    search: true
    writes: true
    inference: true
    http: true
    # structured JSON lines instead of human-readable console output
    json: false
    # queries slower than this are logged at warn
    slow_query_ms: 500

  telemetry:
    # OTLP trace export; null disables it. Requires a build with the otel feature.
    otlp: null
    #   endpoint: http://localhost:4317
    #   service_name: piramid
    # log a line as each instrumented operation finishes, with its duration and fields
    span_events: false

  hardware:
    # cpu-only | gpu | 8gb | 16gb | 32gb. gpu requires runtime.execution: gpu. The memory
    # classes set a host memory budget, which is not implemented, so they are refused.
    profile: cpu-only
    # host memory the process will use; null is unbounded. Not implemented; setting it is an error.
    memory_budget_bytes: null
    # device memory to claim before gpu.reserve_bytes is held back; null is the whole device
    gpu_memory_budget_bytes: null

    gpu:
      # device to open when the host has more than one
      device_ordinal: 0
      # threads per block for distance kernels; a multiple of 32
      distance_block_size: 256
      # device streams opened with the device. Retrieval kernels queue on the first; the model
      # queues on the per-thread stream.
      streams: 2
      # bytes held back for fragmentation and library workspaces
      reserve_bytes: 1073741824
    vram:
      # divide the device budget between weights, KV and retrieval; off, all three share one
      # budget. Each pool refuses an allocation past its share.
      enabled: false
      weights_ratio: 0.6
      kv_ratio: 0.15
      vectors_ratio: 0.25
      # bandwidth retrieval may take while a pass is decoding. Not implemented; any other value
      # is refused.
      retrieval_bandwidth_share: 0.25

  disk:
    # refuse writes below this much free space; null never checks
    min_free_bytes: null
    # drop to read-only at the threshold instead of failing each write
    readonly_on_low_space: true

  http:
    # With PIRAMID_API_KEY set, every route except /api/health and /api/readyz requires
    # Authorization: Bearer <key>. The key is read from the environment only.
    auth:
      # serve a non-loopback bind with no key; setting this while PIRAMID_API_KEY is set is an error
      allow_unauthenticated: false
    # per-client token bucket keyed by peer address; a request over it gets 429 with Retry-After.
    # null disables it. Behind a reverse proxy every client shares one bucket.
    rate_limit:
      requests_per_second: 100
      burst: 200
    # seconds in-flight requests get to finish after SIGINT or SIGTERM, before every open
    # collection is checkpointed and the process exits
    drain_timeout_secs: 30

  # embedding provider, built once at boot; null disables server-side embedding.
  # The openai provider reads its key from OPENAI_API_KEY only; no provider takes one here.
  embedding: null
  #   provider: openai        # openai (or any server speaking that format) | ollama | piramid
  #   model: text-embedding-3-small
  #   base_url: null          # endpoint override for self-hosted or proxied providers
  #   timeout: null           # request timeout in seconds
  #   options: {}             # openai: merged into the request body; ollama: sent as options;
  #                           # piramid: device (cpu | cuda:N), dtype, max_tokens
  #   cache:
  #     # identical text is embedded once; entries past the limit are re-embedded
  #     enabled: true
  #     entries: 10000
  #
  # provider: piramid runs a Qwen3 embedding checkpoint in this process: model is the checkpoint
  # directory, and the build needs the inference-candle feature (gpu-cuda for a GPU device).

runtime:
  search:
    # cosine | euclidean | dot. The metric a collection is created with; the collection stores it
    # and keeps it. Changing this affects only collections created afterwards, and a search that
    # names a different metric than its collection's is refused.
    metric: cosine
    # fan a batch of queries across the worker threads
    parallel: true

  # Quantization is not implemented: every key here must stay at its default.
  quantization:
    # none | int8 | pq | int4 | float16
    level: none
    # keep only the compressed form in memory
    disk_only: false
    # disabled | storage | resident | query_pre_search | result_post_search
    stage: disabled
    # keep full-precision vectors alongside the codes, for reranking
    preserve_raw_vectors: true

  memory:
    # byte ceiling per collection. Not implemented; setting one is an error.
    max_memory_per_collection: null
    # size the data file is first mapped at; it grows from here
    initial_mmap_size: 1048576
    # map the data file; off, records go through ordinary file reads
    use_mmap: true

  wal:
    enabled: true
    # checkpoint after this many operations
    checkpoint_frequency: 1000
    # also checkpoint at the first write this many seconds after the open or the last checkpoint
    checkpoint_interval_secs: null
    # rotate once the log passes this many bytes
    max_log_size: 104857600
    # fsync every write: durable across power loss, and much slower
    sync_on_write: false

  limits:
    # per-collection ceilings; null is unlimited
    max_vectors: null
    max_bytes: null
    max_vector_bytes: null

  # auto | scalar | simd | parallel | gpu. The distance strategy for every collection.
  # gpu needs a build with the gpu-cuda feature and startup.hardware.profile: gpu.
  execution: auto

  # Model execution: a Qwen2 or Qwen3 checkpoint served from this process. Needs a build with the
  # inference-candle feature, and gpu-cuda to run on a GPU. Read once at startup; a reload that
  # changes anything here is refused.
  inference:
    # load the model at startup and serve /api/generate and /v1/chat/completions
    enabled: false
    # directory holding config.json, tokenizer.json, tokenizer_config.json and the safetensors
    model_path: null
    # name clients address the model by, including the OpenAI model id; null is the model_path
    # directory name
    model_name: null
    # directory holding tokenizer.json and tokenizer_config.json when not beside the weights
    tokenizer_path: null
    # qwen2 | qwen3, checked against the checkpoint; null reads it from the checkpoint
    architecture: null
    # cpu | cuda:N. cuda needs the gpu profile and must name hardware.gpu.device_ordinal. null is
    # that device under the gpu profile, else cpu.
    device: null
    # auto | fp32 | fp16 | bf16. auto is the checkpoint precision on a GPU and fp32 on the cpu.
    dtype: auto
    max_sequence_length: 4096
    # run one discarded pass at boot
    warmup: true

    batching:
      # sequences in one forward pass
      max_batch_size: 8
      # sequences admitted and waiting, across all passes
      max_queue_depth: 256
      # token ceiling per step
      max_batched_tokens: 8192
      # admit into a running batch instead of draining it first
      continuous: false
      # split a long prefill across steps
      chunked_prefill: false
      prefill_chunk_tokens: 2048
      # milliseconds a request may wait for a slot; null waits forever
      queue_timeout_ms: 30000

    kv_cache:
      # bytes across every live sequence. Required on the cpu; on a GPU it caps device_fraction.
      max_bytes: null
      # tokens per page, the unit of allocation and eviction
      page_size: 16
      # auto | fp32 | fp16 | bf16. auto matches the weights.
      dtype: auto
      # fraction of the device memory remaining after weights
      device_fraction: 0.9
      # share pages between sequences with an identical prefix
      prefix_sharing: true
      # recompute: a preempted sequence recomputes its pages when it resumes. swap is not
      # implemented and is refused.
      preemption: recompute

    sampling:
      temperature: 0.0  # 0.0 is greedy
      # top_p, top_k and seed need temperature > 0
      top_p: null
      top_k: null
      # 1.0 is no penalty
      repetition_penalty: 1.0
      repetition_window: 64
      # completion length when a request does not set one
      max_new_tokens: 512
      stop: []
      # fixed sampling seed
      seed: null

    # Where retrieval enters the forward pass. Not implemented: every key except chunk_tokens
    # must stay at its default.
    fusion:
      enabled: false
      # registered name of the hook implementation to install
      hook: null
      # collection the hook queries; null uses the request's
      collection: null
      # sequence-start | chunk-boundary | layer-entry
      point: sequence-start
      top_k: 8
      # candidates fetched before filtering, as a multiple of top_k
      overfetch: 1
      score_threshold: null
      # tokens between calls at chunk-boundary
      chunk_tokens: 32
      # fire every Nth decoder layer at layer-entry
      layer_stride: 1
      max_calls_per_sequence: null
      # microseconds a retrieval may take before it is abandoned
      deadline_us: 100
      # skip | stall | error
      on_deadline_miss: skip
      # run retrieval on its own device stream
      own_stream: true
      dedupe_across_calls: true
      # tokens the prompt-stuffed control arm may spend
      token_budget: null
      # store token ids for retrieved documents
      pretokenize_documents: true
      # trained adapter weights
      adapter_path: null

    # Precomputed KV for retrieved documents, reused at prefill with a fraction recomputed.
    # Not implemented: every key must stay at its default.
    document_kv:
      enabled: false
      max_bytes: null
      # device | host | disk
      storage: host
      recompute_ratio: 0.15

# The terminal UI. Read when piramid starts with no subcommand.
console:
  # server to watch; empty follows startup.bind
  base_url: ""
  # website to probe; shown only inside a checkout
  web_url: http://localhost:3000
  # lines kept in memory per unit; full output goes to log_dir
  log_lines: 5000
  log_dir: target/console-logs
  # seconds between health probes and collection refreshes
  refresh_secs: 5
