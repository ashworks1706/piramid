# release-plz owns versioning, changelogs, tags, and crates.io publishing in dependency order.

[workspace]
# One version across every crate.
dependencies_update = false
git_release_enable = true
git_tag_enable = true
publish_features = []

# Conventional-commit sections for the generated changelog.
[changelog]
sort_commits = "oldest"

[[package]]
name = "piramid"
# The umbrella crate carries the README users see on crates.io.
readme_update = false
